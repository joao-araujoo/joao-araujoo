<svg xmlns="http://www.w3.org/2000/svg" width="880" height="246" viewBox="0 0 880 246" role="img" aria-label="[03] ~/projetos/bubo">
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.dot{animation:pulse 2.5s ease-in-out infinite;transform-origin:center}
.cursor{animation:blink 1.1s steps(1) infinite}
.draw{stroke-dasharray:9 10;animation:move 12s linear infinite}
.float{animation:float 6s ease-in-out infinite}
.reveal{animation:fade 1s ease both}
@keyframes pulse{50%{opacity:.3;transform:scale(.65)}}
@keyframes blink{50%{opacity:0}}
@keyframes move{to{stroke-dashoffset:-260}}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
